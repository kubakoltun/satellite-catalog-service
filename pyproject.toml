[project]
name = "satellite-catalog-service"
version = "1.0.0"
description = "Mikroserwis STAC do przyjmowania i przeszukiwania metadanych zobrazowań satelitarnych"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4,<10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "stac-pydantic>=3.6",
    "shapely>=2.0",
    "pyproj>=3.6",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
integration = [
    "testcontainers[postgres]>=4.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = ["integration: requires Docker (Postgres+pgSTAC) - run explicitly with `pytest -m integration`"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satellite_catalog"]
