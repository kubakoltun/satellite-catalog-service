services:

  postgres:
    image: ghcr.io/stac-utils/pgstac:v0.9.11
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One time service that loades the pgSTAC schema to the database
  # It is an indyvidual step so that failing it is more noticeable
  pgstac-migrate:
    image: python:3.12-slim
    command: >
      bash -c "pip install --no-cache-dir 'pypgstac[psycopg]==0.9.12' &&
               pypgstac migrate"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgstac-migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
